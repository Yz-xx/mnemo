# Windows 桌面端打包配置（electron-builder）
appId: com.repo.agent.desktop
productName: AgentDesktop
directories:
  output: release
# 只打包构建产物与包描述，源码不进入安装包
files:
  - out/**
  - package.json
# Electron 二进制走国内镜像：pnpm run 不会把 .npmrc 的 electron_mirror 注入为环境变量，
# 必须在此显式声明，否则会回落到 GitHub 重新下载整包（本地已有缓存也不会命中）
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
