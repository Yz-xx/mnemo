# pnpm 工作区：公共包与业务应用分别收纳
packages:
  - 'packages/*'
  - 'apps/*'

# 允许执行安装脚本的依赖（pnpm 11+ 用 allowBuilds 取代 onlyBuiltDependencies）
# esbuild 需要 postinstall 校验平台原生二进制（tsx / Vite 均依赖它）
# electron 需要 postinstall 下载对应平台的 Electron 运行时二进制
# unrs-resolver 需要 postinstall 校验平台原生二进制（eslint-plugin-import-x 的解析器依赖）
allowBuilds:
  esbuild: true
  electron: true
  electron-winstaller: true
  unrs-resolver: true
  vue-demi: true

# LanceDB 自带的 embedding 函数是可选能力（本项目向量化走 Ollama / OpenAI 接口），
# 忽略其 transformers 依赖链，避免额外安装约 200MB 的本地推理运行时
ignoredOptionalDependencies:
  - '@huggingface/transformers'

minimumReleaseAgeExclude:
  - electron@44.4.5
